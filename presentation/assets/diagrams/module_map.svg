<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .pill { fill: #65483A; rx: 20px; }
      .pill-text { font-family: 'Times New Roman', serif; font-size: 26px; font-weight: bold; fill: #FAF9F6; text-anchor: middle; }
      .main-title { font-family: 'Times New Roman', serif; font-size: 38px; font-weight: bold; fill: #171513; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 19px; fill: #65483A; text-anchor: middle; }
      
      .outer-card { fill: #F4EFEA; stroke: #65483A; stroke-width: 2.5px; rx: 16px; }
      .inner-card { fill: #FFFFFF; stroke: #DDD4C8; stroke-width: 1.5px; rx: 12px; }
      .card-header { fill: #E4DCD1; stroke: #65483A; stroke-width: 1.5px; rx: 12px 12px 0 0; }
      .card-header-accent { fill: #65483A; rx: 12px 12px 0 0; }
      
      .tier-title { font-family: 'Times New Roman', serif; font-size: 21px; font-weight: bold; fill: #171513; text-anchor: middle; }
      .tier-title-light { font-family: 'Times New Roman', serif; font-size: 21px; font-weight: bold; fill: #FAF9F6; text-anchor: middle; }
      .box-title { font-family: 'Times New Roman', serif; font-size: 18px; font-weight: bold; fill: #171513; }
      .box-desc { font-family: 'Times New Roman', serif; font-size: 15px; fill: #332B27; }
      .box-meta { font-family: 'Times New Roman', serif; font-size: 14px; fill: #705D53; font-style: italic; }
      
      .conn-line { stroke: #65483A; stroke-width: 2.5px; fill: none; marker-end: url(#arrow); }
      .conn-dash { stroke: #8D7B68; stroke-width: 2px; stroke-dasharray: 6,5; fill: none; marker-end: url(#arrow); }
      .edge-label { font-family: 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #65483A; text-anchor: middle; }
      .edge-bg { fill: #FAF9F6; stroke: #DDD4C8; stroke-width: 1px; rx: 6px; }
      
      .note-badge { fill: #EDE5DA; stroke: #65483A; stroke-width: 1.5px; rx: 10px; }
      .note-text { font-family: 'Times New Roman', serif; font-size: 15px; font-weight: bold; fill: #65483A; }
      
      .uc-ellipse { fill: #FFFFFF; stroke: #65483A; stroke-width: 2px; }
      .uc-text { font-family: 'Times New Roman', serif; font-size: 15px; font-weight: bold; fill: #171513; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#65483A"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" class="bg"/>

  <rect x="760" y="30" width="400" height="42" class="pill"/>
  <text x="960" y="60" class="pill-text">Modular Architecture</text>
  <text x="960" y="115" class="main-title">CipherVault Comprehensive Module &amp; Component Map</text>
  <text x="960" y="145" class="subtitle">Component inventory across Android Client (app), Spring Boot Microservice (backend), and Desktop Manager (server-control)</text>

  <!-- MODULE 1: ANDROID CLIENT (x: 50, y: 190, w: 560, h: 780) -->
  <rect x="50" y="190" width="560" height="780" class="outer-card"/>
  <rect x="50" y="190" width="560" height="45" class="card-header"/>
  <text x="330" y="220" class="tier-title">Module 1: Android Client (app/)</text>

  <rect x="75" y="255" width="510" height="205" class="inner-card"/>
  <text x="95" y="285" class="box-title">Presentation &amp; UI Controllers</text>
  <text x="95" y="312" class="box-desc">&#8226; <tspan font-weight="bold">Splash &amp; Onboarding:</tspan> SplashActivity, OnboardingActivity</text>
  <text x="95" y="337" class="box-desc">&#8226; <tspan font-weight="bold">Authentication:</tspan> LoginActivity, SignupActivity, AuthViewModel</text>
  <text x="95" y="362" class="box-desc">&#8226; <tspan font-weight="bold">Vault &amp; Home:</tspan> MainActivity, FragmentHome, FragmentVault</text>
  <text x="95" y="387" class="box-desc">&#8226; <tspan font-weight="bold">Staging &amp; Preview:</tspan> UploadStagingActivity, StagedFileAdapter</text>
  <text x="95" y="412" class="box-desc">&#8226; <tspan font-weight="bold">Forensics &amp; Search:</tspan> FileDetailsBottomSheet, FragmentSearch</text>
  <text x="95" y="437" class="box-desc">&#8226; <tspan font-weight="bold">AppLock &amp; Profile:</tspan> AppLockActivity, FragmentSettings</text>

  <rect x="75" y="480" width="510" height="155" class="inner-card"/>
  <text x="95" y="510" class="box-title">Core Services &amp; Domain Managers</text>
  <text x="95" y="537" class="box-desc">&#8226; <tspan font-weight="bold">SessionManager:</tspan> Multi-target disk purge, token migration guard</text>
  <text x="95" y="562" class="box-desc">&#8226; <tspan font-weight="bold">ServerConnectionManager:</tspan> Health probe, latency &amp; port ping</text>
  <text x="95" y="587" class="box-desc">&#8226; <tspan font-weight="bold">TransferManager &amp; TransferService:</tspan> Foreground notification</text>
  <text x="95" y="612" class="box-desc">&#8226; <tspan font-weight="bold">ThemeManager:</tspan> Material 3 Monet dynamic extraction</text>

  <rect x="75" y="655" width="510" height="145" class="inner-card"/>
  <text x="95" y="685" class="box-title">Networking &amp; Security Providers</text>
  <text x="95" y="712" class="box-desc">&#8226; <tspan font-weight="bold">ApiClient:</tspan> Retrofit 2 REST instance with OkHttp 4 client</text>
  <text x="95" y="737" class="box-desc">&#8226; <tspan font-weight="bold">AuthInterceptor:</tspan> Bearer token injection &amp; 401 catch</text>
  <text x="95" y="762" class="box-desc">&#8226; <tspan font-weight="bold">StreamingRequestBody:</tspan> Live byte transfer progress</text>
  <text x="95" y="785" class="box-meta">Tied to Android Keystore MasterKey.</text>

  <rect x="75" y="820" width="510" height="130" class="note-badge"/>
  <text x="95" y="850" class="note-text">&#x2714; Android Build Metrics</text>
  <text x="95" y="875" class="box-meta">82 unit tests passing (Robolectric / JUnit 4).</text>
  <text x="95" y="900" class="box-meta">Compiled via Gradle 8.9 with Android SDK API 35/37.</text>
  <text x="95" y="925" class="box-meta">Debug APK: app-debug.apk (~9 MB).</text>

  <!-- MODULE 2: SPRING BOOT BACKEND (x: 640, y: 190, w: 680, h: 780) -->
  <rect x="640" y="190" width="680" height="780" class="outer-card"/>
  <rect x="640" y="190" width="680" height="45" class="card-header-accent"/>
  <text x="980" y="220" class="tier-title-light">Module 2: Spring Boot Microservice (backend/)</text>

  <rect x="665" y="255" width="630" height="165" class="inner-card"/>
  <text x="685" y="285" class="box-title">REST Controllers (/api/*)</text>
  <text x="685" y="312" class="box-desc">&#8226; <tspan font-weight="bold">AuthController:</tspan> POST /api/auth/register, /login, /logout, /change-password</text>
  <text x="685" y="337" class="box-desc">&#8226; <tspan font-weight="bold">FileController:</tspan> POST /upload, GET /files, GET /download, DELETE /&#123;id&#125;</text>
  <text x="685" y="362" class="box-desc">&#8226; <tspan font-weight="bold">UserController:</tspan> GET /user/profile, POST /user/photo</text>
  <text x="685" y="387" class="box-desc">&#8226; <tspan font-weight="bold">ActivityController &amp; TransferController:</tspan> /activities, /transfers</text>
  <text x="685" y="412" class="box-desc">&#8226; <tspan font-weight="bold">HealthController:</tspan> GET /api/health (Uptime &amp; status probe)</text>

  <rect x="665" y="440" width="630" height="195" class="inner-card"/>
  <text x="685" y="470" class="box-title">Cryptographic, Storage &amp; Search Services</text>
  <text x="685" y="497" class="box-desc">&#8226; <tspan font-weight="bold">FileStorageService:</tspan> 16 KB streaming I/O; 10 GB quota; per-user SHA-256 deduplication</text>
  <text x="685" y="522" class="box-desc">&#8226; <tspan font-weight="bold">EncryptionService:</tspan> AES-256-GCM authenticated cipher streams (12B IV + 16B GHASH)</text>
  <text x="685" y="547" class="box-desc">&#8226; <tspan font-weight="bold">KeyManagementService:</tspan> PBKDF2 (65,536 iterations) Server KEK wrapping user UDEKs</text>
  <text x="685" y="572" class="box-desc">&#8226; <tspan font-weight="bold">MetadataExtractionService:</tspan> Subprocess pipeline executing Phil Harvey's ExifTool</text>
  <text x="685" y="597" class="box-desc">&#8226; <tspan font-weight="bold">FileSearchService &amp; FacetService:</tspan> Dynamic suggestion chips; JPA Criteria search</text>
  <text x="685" y="622" class="box-desc">&#8226; <tspan font-weight="bold">LoginRateLimiterService:</tspan> Sliding-window brute-force defense (5 attempts = 15m)</text>

  <rect x="665" y="655" width="630" height="145" class="inner-card"/>
  <text x="685" y="685" class="box-title">Persistence &amp; Spring Data Repositories</text>
  <text x="685" y="712" class="box-desc">&#8226; UserRepository, FileRepository, FileMetadataRepository</text>
  <text x="685" y="737" class="box-desc">&#8226; ActivityEventRepository, TransferRepository</text>
  <text x="685" y="762" class="box-desc">&#8226; Maps 5 authoritative entities with cascading delete foreign keys</text>
  <text x="685" y="785" class="box-meta">MySQL 8.0 InnoDB database with B-Tree indexes.</text>

  <rect x="665" y="820" width="630" height="130" class="note-badge"/>
  <text x="685" y="850" class="note-text">&#x2714; Backend Build Metrics</text>
  <text x="685" y="875" class="box-meta">138 automated unit/integration tests passing (100% pass rate).</text>
  <text x="685" y="900" class="box-meta">Running on Spring Boot 3.3.4 with Java 21 LTS virtual threads.</text>
  <text x="685" y="925" class="box-meta">Flat 28-36 MB RAM memory footprint during multi-gigabyte transfers.</text>

  <!-- MODULE 3: SERVER CONTROL (x: 1350, y: 190, w: 520, h: 780) -->
  <rect x="1350" y="190" width="520" height="780" class="outer-card"/>
  <rect x="1350" y="190" width="520" height="45" class="card-header"/>
  <text x="1610" y="220" class="tier-title">Module 3: Server Control (PySide6)</text>

  <rect x="1375" y="255" width="470" height="165" class="inner-card"/>
  <text x="1395" y="285" class="box-title">Desktop Launcher &amp; Dashboard</text>
  <text x="1395" y="312" class="box-desc">&#8226; <tspan font-weight="bold">run.bat:</tspan> Root-level launcher (%~dp0 path anchored)</text>
  <text x="1395" y="337" class="box-desc">&#8226; <tspan font-weight="bold">main.py:</tspan> PySide6 (Qt 6) Graphical Dashboard</text>
  <text x="1395" y="362" class="box-desc">&#8226; Manual Server Start / Stop / Restart controls</text>
  <text x="1395" y="387" class="box-desc">&#8226; Zero unwanted auto-start on GUI open</text>
  <text x="1395" y="412" class="box-meta">Ensures controlled administrative server lifecycle.</text>

  <rect x="1375" y="440" width="470" height="195" class="inner-card"/>
  <text x="1395" y="470" class="box-title">Process &amp; Network Diagnostics</text>
  <text x="1395" y="497" class="box-desc">&#8226; <tspan font-weight="bold">ProcessManager:</tspan> Spawns Maven Spring Boot daemon</text>
  <text x="1395" y="522" class="box-desc">&#8226; <tspan font-weight="bold">LogStreamer:</tspan> Threaded live Spring Boot output capture</text>
  <text x="1395" y="547" class="box-desc">&#8226; <tspan font-weight="bold">NetworkMonitor:</tspan> Socket ping on port 8080 &amp; port 3306</text>
  <text x="1395" y="572" class="box-desc">&#8226; Real-time status indicators (ONLINE / OFFLINE)</text>
  <text x="1395" y="597" class="box-desc">&#8226; Graceful process tree termination (taskkill /T /F)</text>
  <text x="1395" y="622" class="box-meta">Prevents orphaned Java processes on port 8080.</text>

  <rect x="1375" y="655" width="470" height="145" class="inner-card"/>
  <text x="1395" y="685" class="box-title">Configuration &amp; Settings</text>
  <text x="1395" y="712" class="box-desc">&#8226; <tspan font-weight="bold">settings.json:</tspan> Persistent host, port, and paths</text>
  <text x="1395" y="737" class="box-desc">&#8226; Resolves Android SDK and Maven wrappers</text>
  <text x="1395" y="762" class="box-desc">&#8226; Validated across multi-directory execution</text>
  <text x="1395" y="785" class="box-meta">Located directly at project root.</text>

  <rect x="1375" y="820" width="470" height="130" class="note-badge"/>
  <text x="1395" y="850" class="note-text">&#x2714; Desktop Utility Metrics</text>
  <text x="1395" y="875" class="box-meta">23 automated Python unit tests passing.</text>
  <text x="1395" y="900" class="box-meta">Verified error-handling and subprocess control.</text>
  <text x="1395" y="925" class="box-meta">Direct root run.bat launcher operational.</text>

  <!-- Footer -->
  <text x="960" y="1060" font-family="'Times New Roman', serif" font-size="15px" fill="#705D53" text-anchor="middle">
    All 3 modules form a cohesive sovereign private cloud ecosystem with independent, automated test suites.
  </text>
</svg>