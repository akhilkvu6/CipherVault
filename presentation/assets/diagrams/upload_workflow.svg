<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .pill { fill: #65483A; rx: 20px; }
      .pill-text { font-family: 'Times New Roman', serif; font-size: 26px; font-weight: bold; fill: #FAF9F6; text-anchor: middle; }
      .main-title { font-family: 'Times New Roman', serif; font-size: 38px; font-weight: bold; fill: #171513; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 19px; fill: #65483A; text-anchor: middle; }
      
      .outer-card { fill: #F4EFEA; stroke: #65483A; stroke-width: 2.5px; rx: 16px; }
      .inner-card { fill: #FFFFFF; stroke: #DDD4C8; stroke-width: 1.5px; rx: 12px; }
      .card-header { fill: #E4DCD1; stroke: #65483A; stroke-width: 1.5px; rx: 12px 12px 0 0; }
      .card-header-accent { fill: #65483A; rx: 12px 12px 0 0; }
      
      .proc-circle { fill: #E4DCD1; stroke: #65483A; stroke-width: 2.5px; }
      .proc-id { font-family: 'Times New Roman', serif; font-size: 19px; font-weight: bold; fill: #65483A; text-anchor: middle; }
      .proc-title { font-family: 'Times New Roman', serif; font-size: 17px; font-weight: bold; fill: #171513; text-anchor: middle; }
      
      .store-card { fill: #FFFFFF; stroke: #65483A; stroke-width: 2px; rx: 10px; }
      .store-header { fill: #E4DCD1; stroke: #65483A; stroke-width: 1.5px; rx: 10px 10px 0 0; }
      .store-title { font-family: 'Times New Roman', serif; font-size: 17px; font-weight: bold; fill: #171513; text-anchor: middle; }
      .store-desc { font-family: 'Times New Roman', serif; font-size: 14.5px; fill: #332B27; }
      
      .diamond { fill: #EDE5DA; stroke: #65483A; stroke-width: 2.5px; }
      .diamond-title { font-family: 'Times New Roman', serif; font-size: 15.5px; font-weight: bold; fill: #171513; text-anchor: middle; }
      
      .tier-title { font-family: 'Times New Roman', serif; font-size: 21px; font-weight: bold; fill: #171513; text-anchor: middle; }
      .tier-title-light { font-family: 'Times New Roman', serif; font-size: 21px; font-weight: bold; fill: #FAF9F6; text-anchor: middle; }
      .box-title { font-family: 'Times New Roman', serif; font-size: 18px; font-weight: bold; fill: #171513; }
      .box-desc { font-family: 'Times New Roman', serif; font-size: 15px; fill: #332B27; }
      .box-meta { font-family: 'Times New Roman', serif; font-size: 14px; fill: #705D53; font-style: italic; }
      
      .conn-line { stroke: #65483A; stroke-width: 2.5px; fill: none; marker-end: url(#arrow); }
      .conn-dash { stroke: #8D7B68; stroke-width: 2px; stroke-dasharray: 6,5; fill: none; marker-end: url(#arrow); }
      .edge-label { font-family: 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #65483A; text-anchor: middle; }
      .edge-bg { fill: #FAF9F6; stroke: #DDD4C8; stroke-width: 1px; rx: 6px; }
      
      .note-badge { fill: #EDE5DA; stroke: #65483A; stroke-width: 1.5px; rx: 10px; }
      .note-text { font-family: 'Times New Roman', serif; font-size: 15px; font-weight: bold; fill: #65483A; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#65483A"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" class="bg"/>

  <rect x="760" y="30" width="400" height="42" class="pill"/>
  <text x="960" y="60" class="pill-text">Workflow Engineering</text>
  <text x="960" y="115" class="main-title">CipherVault Streaming Upload &amp; Ingestion Workflow</text>
  <text x="960" y="145" class="subtitle">Complete processing order: Pre-upload staging, 1 GB batch limit, SHA-256 duplicate detection, ExifTool, and AES-256-GCM</text>

  <!-- Step 1: Selection & Staging (x: 50, y: 200, w: 260, h: 220) -->
  <rect x="50" y="200" width="260" height="220" class="inner-card"/>
  <rect x="50" y="200" width="260" height="40" class="card-header"/>
  <text x="180" y="227" class="tier-title">Step 1: Staging Queue</text>
  <text x="70" y="270" class="box-desc">&#8226; User picks files via system picker</text>
  <text x="70" y="295" class="box-desc">&#8226; UploadStagingActivity displays queue</text>
  <text x="70" y="320" class="box-desc">&#8226; Computes batch bytes in real-time</text>
  <text x="70" y="345" class="box-desc">&#8226; Modal inspection &amp; item removal</text>
  <text x="70" y="375" class="box-meta">Prevents accidental batch uploads.</text>
  <rect x="65" y="390" width="230" height="22" class="note-badge"/>
  <text x="180" y="406" class="edge-label" text-anchor="middle">Enforces 1 GB Batch Ceiling</text>

  <!-- Step 2: Quota Check (Diamond: cx: 430, cy: 310, w: 180, h: 140) -->
  <polygon points="430,220 520,310 430,400 340,310" class="diamond"/>
  <text x="430" y="300" class="diamond-title">Batch &gt; 1 GB or</text>
  <text x="430" y="325" class="diamond-title">Total &gt; 10 GB?</text>

  <!-- Reject Branch 1 -->
  <rect x="340" y="460" width="180" height="80" class="inner-card" style="stroke: #C62828; fill: #FFEBEE;"/>
  <text x="430" y="495" class="box-title" fill="#C62828" text-anchor="middle">Reject Batch</text>
  <text x="430" y="520" class="box-desc" text-anchor="middle">Display Red Banner</text>

  <!-- Step 3: Stream Transfer (x: 580, y: 200, w: 260, h: 220) -->
  <rect x="580" y="200" width="260" height="220" class="inner-card"/>
  <rect x="580" y="200" width="260" height="40" class="card-header"/>
  <text x="710" y="227" class="tier-title">Step 2: Stream Transfer</text>
  <text x="600" y="270" class="box-desc">&#8226; POST /api/files/upload</text>
  <text x="600" y="295" class="box-desc">&#8226; Bearer &lt;JWT&gt; Authorization</text>
  <text x="600" y="320" class="box-desc">&#8226; OkHttp StreamingRequestBody</text>
  <text x="600" y="345" class="box-desc">&#8226; Foreground transfer notification</text>
  <text x="600" y="375" class="box-meta">Streams multipart without heap spikes.</text>

  <!-- Step 4: Spool & Quota (x: 900, y: 200, w: 260, h: 220) -->
  <rect x="900" y="200" width="260" height="220" class="inner-card"/>
  <rect x="900" y="200" width="260" height="40" class="card-header"/>
  <text x="1030" y="227" class="tier-title">Step 3: Server Spool</text>
  <text x="920" y="270" class="box-desc">&#8226; Spools to temp file buffer</text>
  <text x="920" y="295" class="box-desc">&#8226; Validates size &lt;= 1,073,741,824 B</text>
  <text x="920" y="320" class="box-desc">&#8226; Checks user.used + size &lt;= 10 GB</text>
  <text x="920" y="345" class="box-desc">&#8226; Path containment security check</text>
  <text x="920" y="375" class="box-meta">Rejects if 10 GB ceiling exceeded.</text>

  <!-- Step 5: SHA-256 & Duplicate (Diamond: cx: 1280, cy: 310) -->
  <polygon points="1280,220 1370,310 1280,400 1190,310" class="diamond"/>
  <text x="1280" y="295" class="diamond-title">SHA-256 Exists</text>
  <text x="1280" y="318" class="diamond-title">in user's</text>
  <text x="1280" y="340" class="diamond-title">stored_files?</text>

  <!-- Duplicate Reject -->
  <rect x="1190" y="460" width="180" height="80" class="inner-card" style="stroke: #C62828; fill: #FFEBEE;"/>
  <text x="1280" y="495" class="box-title" fill="#C62828" text-anchor="middle">409 Conflict</text>
  <text x="1280" y="520" class="box-desc" text-anchor="middle">Duplicate Rejection</text>

  <!-- Step 6: ExifTool & Preview (x: 1440, y: 200, w: 260, h: 220) -->
  <rect x="1440" y="200" width="260" height="220" class="inner-card"/>
  <rect x="1440" y="200" width="260" height="40" class="card-header"/>
  <text x="1570" y="227" class="tier-title">Step 4: Media Forensics</text>
  <text x="1460" y="270" class="box-desc">&#8226; Generates JPEG thumbnail cache</text>
  <text x="1460" y="295" class="box-desc">&#8226; Saves to storage/previews/</text>
  <text x="1460" y="320" class="box-desc">&#8226; Executes ExifTool on plaintext</text>
  <text x="1460" y="345" class="box-desc">&#8226; Parses 29 camera &amp; codec fields</text>
  <text x="1460" y="375" class="box-meta">Extracted prior to encryption.</text>

  <!-- LOWER PIPELINE: ENCRYPTION & PERSISTENCE -->
  <!-- Step 7: Encryption (x: 1440, y: 580, w: 260, h: 220) -->
  <rect x="1440" y="580" width="260" height="220" class="inner-card" style="stroke: #65483A; stroke-width: 2px;"/>
  <rect x="1440" y="580" width="260" height="40" class="card-header-accent"/>
  <text x="1570" y="607" class="tier-title-light">Step 5: AES-256-GCM</text>
  <text x="1460" y="650" class="box-desc">&#8226; Unwraps UDEK via Server KEK</text>
  <text x="1460" y="675" class="box-desc">&#8226; Fresh 12-byte IV (SecureRandom)</text>
  <text x="1460" y="700" class="box-desc">&#8226; Streams via CipherOutputStream</text>
  <text x="1460" y="725" class="box-desc">&#8226; Writes 16-byte GHASH tag</text>
  <text x="1460" y="750" class="box-desc">&#8226; Saved to storage/encrypted/{uuid}</text>

  <!-- Step 8: Database Persistence (x: 900, y: 580, w: 460, h: 220) -->
  <rect x="900" y="580" width="460" height="220" class="inner-card"/>
  <rect x="900" y="580" width="460" height="40" class="card-header"/>
  <text x="1130" y="607" class="tier-title">Step 6: Atomic Database Persistence</text>
  <text x="920" y="650" class="box-desc">&#8226; <tspan font-weight="bold">stored_files:</tspan> Insert original/UUID names, size, path, SHA-256</text>
  <text x="920" y="680" class="box-desc">&#8226; <tspan font-weight="bold">file_metadata:</tspan> Insert camera optics, ISO, aperture, resolution, codecs</text>
  <text x="920" y="710" class="box-desc">&#8226; <tspan font-weight="bold">users:</tspan> Atomic increment: used_storage = used_storage + fileSize</text>
  <text x="920" y="740" class="box-desc">&#8226; <tspan font-weight="bold">activity_events &amp; transfers:</tspan> Log UPLOAD event and batch completion</text>
  <text x="920" y="770" class="box-meta">ACID transaction guarantees quota consistency.</text>

  <!-- Step 9: Client Confirmation (x: 340, y: 580, w: 480, h: 220) -->
  <rect x="340" y="580" width="480" height="220" class="inner-card" style="fill: #E8F5E9; stroke: #2E7D32; stroke-width: 2px;"/>
  <rect x="340" y="580" width="480" height="40" style="fill: #2E7D32; rx: 12px 12px 0 0;"/>
  <text x="580" y="607" class="tier-title-light">Step 7: Upload Success Response</text>
  <text x="360" y="650" class="box-desc">&#8226; Backend returns HTTP 200 OK (FileUploadResponse JSON)</text>
  <text x="360" y="680" class="box-desc">&#8226; Android client receives confirmation &amp; dismisses staged queue</text>
  <text x="360" y="710" class="box-desc">&#8226; Vault explorer updates with new 2-column card</text>
  <text x="360" y="740" class="box-desc">&#8226; Storage quota progress bar dynamically refreshes</text>
  <text x="360" y="770" class="box-meta">&#x2714; Zero unencrypted temporary files retained on host.</text>

  <!-- CONNECTORS -->
  <line x1="310" y1="310" x2="340" y2="310" class="conn-line"/>
  <line x1="430" y1="400" x2="430" y2="460" class="conn-line"/>
  <line x1="520" y1="310" x2="580" y2="310" class="conn-line"/>
  <line x1="840" y1="310" x2="900" y2="310" class="conn-line"/>
  <line x1="1160" y1="310" x2="1190" y2="310" class="conn-line"/>
  <line x1="1280" y1="400" x2="1280" y2="460" class="conn-line"/>
  <line x1="1370" y1="310" x2="1440" y2="310" class="conn-line"/>
  <line x1="1570" y1="420" x2="1570" y2="580" class="conn-line"/>
  <line x1="1440" y1="690" x2="1360" y2="690" class="conn-line"/>
  <line x1="900" y1="690" x2="820" y2="690" class="conn-line"/>

  <!-- Footer -->
  <text x="960" y="1060" font-family="'Times New Roman', serif" font-size="15px" fill="#705D53" text-anchor="middle">
    All 7 stages are executed in constant-memory stream pipeline with automatic rollback upon failure.
  </text>
</svg>