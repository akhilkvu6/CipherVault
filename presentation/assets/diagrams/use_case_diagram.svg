<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .pill { fill: #65483A; rx: 20px; }
      .pill-text { font-family: 'Times New Roman', serif; font-size: 26px; font-weight: bold; fill: #FAF9F6; text-anchor: middle; }
      .main-title { font-family: 'Times New Roman', serif; font-size: 38px; font-weight: bold; fill: #171513; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 19px; fill: #65483A; text-anchor: middle; }
      
      .outer-card { fill: #F4EFEA; stroke: #65483A; stroke-width: 2.5px; rx: 16px; }
      .inner-card { fill: #FFFFFF; stroke: #DDD4C8; stroke-width: 1.5px; rx: 12px; }
      .card-header { fill: #E4DCD1; stroke: #65483A; stroke-width: 1.5px; rx: 12px 12px 0 0; }
      .card-header-accent { fill: #65483A; rx: 12px 12px 0 0; }
      
      .tier-title { font-family: 'Times New Roman', serif; font-size: 21px; font-weight: bold; fill: #171513; text-anchor: middle; }
      .tier-title-light { font-family: 'Times New Roman', serif; font-size: 21px; font-weight: bold; fill: #FAF9F6; text-anchor: middle; }
      .box-title { font-family: 'Times New Roman', serif; font-size: 18px; font-weight: bold; fill: #171513; }
      .box-desc { font-family: 'Times New Roman', serif; font-size: 15px; fill: #332B27; }
      .box-meta { font-family: 'Times New Roman', serif; font-size: 14px; fill: #705D53; font-style: italic; }
      
      .conn-line { stroke: #65483A; stroke-width: 2.5px; fill: none; marker-end: url(#arrow); }
      .conn-dash { stroke: #8D7B68; stroke-width: 2px; stroke-dasharray: 6,5; fill: none; marker-end: url(#arrow); }
      .edge-label { font-family: 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #65483A; text-anchor: middle; }
      .edge-bg { fill: #FAF9F6; stroke: #DDD4C8; stroke-width: 1px; rx: 6px; }
      
      .note-badge { fill: #EDE5DA; stroke: #65483A; stroke-width: 1.5px; rx: 10px; }
      .note-text { font-family: 'Times New Roman', serif; font-size: 15px; font-weight: bold; fill: #65483A; }
      
      .uc-ellipse { fill: #FFFFFF; stroke: #65483A; stroke-width: 2px; }
      .uc-text { font-family: 'Times New Roman', serif; font-size: 15px; font-weight: bold; fill: #171513; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#65483A"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" class="bg"/>

  <rect x="760" y="30" width="400" height="42" class="pill"/>
  <text x="960" y="60" class="pill-text">UML Modeling</text>
  <text x="960" y="115" class="main-title">CipherVault Standard UML Use Case Diagram</text>
  <text x="960" y="145" class="subtitle">Complete user-facing and administrator interactions across the CipherVault sovereign cloud boundary</text>

  <!-- ACTOR 1: MOBILE USER (Left: x: 100, y: 440) -->
  <circle cx="150" cy="480" r="35" fill="#E4DCD1" stroke="#65483A" stroke-width="2.5"/>
  <circle cx="150" cy="465" r="14" fill="#65483A"/>
  <path d="M 125 500 Q 150 485 175 500" fill="none" stroke="#65483A" stroke-width="3"/>
  <line x1="150" y1="515" x2="150" y2="590" stroke="#65483A" stroke-width="3"/>
  <line x1="105" y1="545" x2="195" y2="545" stroke="#65483A" stroke-width="3"/>
  <line x1="150" y1="590" x2="115" y2="670" stroke="#65483A" stroke-width="3"/>
  <line x1="150" y1="590" x2="185" y2="670" stroke="#65483A" stroke-width="3"/>
  <text x="150" y="715" class="box-title" text-anchor="middle">Mobile Vault</text>
  <text x="150" y="740" class="box-title" text-anchor="middle">User</text>
  <text x="150" y="765" class="box-meta" text-anchor="middle">(Primary Actor)</text>

  <!-- ACTOR 2: HOST ADMINISTRATOR (Right: x: 1770, y: 440) -->
  <circle cx="1770" cy="480" r="35" fill="#E4DCD1" stroke="#65483A" stroke-width="2.5"/>
  <circle cx="1770" cy="465" r="14" fill="#65483A"/>
  <path d="M 1745 500 Q 1770 485 1795 500" fill="none" stroke="#65483A" stroke-width="3"/>
  <line x1="1770" y1="515" x2="1770" y2="590" stroke="#65483A" stroke-width="3"/>
  <line x1="1725" y1="545" x2="1815" y2="545" stroke="#65483A" stroke-width="3"/>
  <line x1="1770" y1="590" x2="1735" y2="670" stroke="#65483A" stroke-width="3"/>
  <line x1="1770" y1="590" x2="1805" y2="670" stroke="#65483A" stroke-width="3"/>
  <text x="1770" y="715" class="box-title" text-anchor="middle">Host</text>
  <text x="1770" y="740" class="box-title" text-anchor="middle">Administrator</text>
  <text x="1770" y="765" class="box-meta" text-anchor="middle">(Server Control)</text>

  <!-- SYSTEM BOUNDARY RECTANGLE (x: 320, y: 190, w: 1360, h: 790) -->
  <rect x="320" y="190" width="1360" height="790" class="outer-card" style="stroke-width: 3px;"/>
  <rect x="320" y="190" width="1360" height="45" class="card-header-accent"/>
  <text x="1000" y="220" class="tier-title-light">System Boundary: CipherVault Sovereign Mobile Cloud</text>

  <!-- USE CASE ELLIPSES IN 3 CLEAN COLUMNS -->
  <!-- COLUMN 1: Access & Setup (x: 360 to 700) -->
  <ellipse cx="530" cy="290" rx="150" ry="32" class="uc-ellipse"/>
  <text x="530" y="296" class="uc-text">UC-01: Configure &amp; Test Server</text>

  <ellipse cx="530" cy="380" rx="150" ry="32" class="uc-ellipse"/>
  <text x="530" y="386" class="uc-text">UC-02: Register New Account</text>

  <ellipse cx="530" cy="470" rx="150" ry="32" class="uc-ellipse"/>
  <text x="530" y="476" class="uc-text">UC-03: Authenticate &amp; Login</text>

  <ellipse cx="530" cy="560" rx="150" ry="32" class="uc-ellipse"/>
  <text x="530" y="566" class="uc-text">UC-04: Biometric / PIN AppLock</text>

  <ellipse cx="530" cy="650" rx="150" ry="32" class="uc-ellipse"/>
  <text x="530" y="656" class="uc-text">UC-05: Monitor 10 GB Quota</text>

  <ellipse cx="530" cy="740" rx="150" ry="32" class="uc-ellipse"/>
  <text x="530" y="746" class="uc-text">UC-06: View Audit Activity</text>

  <ellipse cx="530" cy="830" rx="150" ry="32" class="uc-ellipse"/>
  <text x="530" y="836" class="uc-text">UC-07: Secure Logout &amp; Purge</text>

  <!-- COLUMN 2: Ingestion & Vault (x: 740 to 1100) -->
  <ellipse cx="920" cy="310" rx="160" ry="32" class="uc-ellipse"/>
  <text x="920" y="316" class="uc-text">UC-08: Pre-Upload Staging Queue</text>

  <ellipse cx="920" cy="410" rx="160" ry="32" class="uc-ellipse" style="stroke: #2E7D32; stroke-width: 2.5px;"/>
  <text x="920" y="416" class="uc-text" fill="#2E7D32">&#x2714; UC-09: Stream Encrypt &amp; Upload</text>

  <ellipse cx="920" cy="510" rx="160" ry="32" class="uc-ellipse"/>
  <text x="920" y="516" class="uc-text">UC-10: Browse Vault &amp; Sort Grid</text>

  <ellipse cx="920" cy="610" rx="160" ry="32" class="uc-ellipse"/>
  <text x="920" y="616" class="uc-text">UC-11: Inspect Pre-Upload Preview</text>

  <ellipse cx="920" cy="710" rx="160" ry="32" class="uc-ellipse"/>
  <text x="920" y="716" class="uc-text">UC-12: Monitor Active Transfers</text>

  <!-- COLUMN 3: Retrieval & Forensics (x: 1140 to 1540) -->
  <ellipse cx="1340" cy="310" rx="160" ry="32" class="uc-ellipse"/>
  <text x="1340" y="316" class="uc-text">UC-13: Search Metadata Chips</text>

  <ellipse cx="1340" cy="410" rx="160" ry="32" class="uc-ellipse"/>
  <text x="1340" y="416" class="uc-text">UC-14: View Forensic EXIF &amp; Codecs</text>

  <ellipse cx="1340" cy="510" rx="160" ry="32" class="uc-ellipse" style="stroke: #2E7D32; stroke-width: 2.5px;"/>
  <text x="1340" y="516" class="uc-text" fill="#2E7D32">&#x2714; UC-15: Stream Decrypted Download</text>

  <ellipse cx="1340" cy="610" rx="160" ry="32" class="uc-ellipse"/>
  <text x="1340" y="616" class="uc-text">UC-16: Cascading File Deletion</text>

  <ellipse cx="1340" cy="740" rx="160" ry="32" class="uc-ellipse" style="fill: #EDE5DA; stroke: #65483A;"/>
  <text x="1340" y="746" class="uc-text">UC-17: Manage Server Control GUI</text>

  <ellipse cx="1340" cy="830" rx="160" ry="32" class="uc-ellipse" style="fill: #EDE5DA; stroke: #65483A;"/>
  <text x="1340" y="836" class="uc-text">UC-18: Manage Database Backups</text>

  <!-- USER ASSOCIATIONS -->
  <line x1="185" y1="520" x2="380" y2="290" class="conn-line"/>
  <line x1="185" y1="535" x2="380" y2="380" class="conn-line"/>
  <line x1="195" y1="545" x2="380" y2="470" class="conn-line"/>
  <line x1="195" y1="555" x2="380" y2="560" class="conn-line"/>
  <line x1="185" y1="570" x2="380" y2="650" class="conn-line"/>
  <line x1="185" y1="585" x2="380" y2="740" class="conn-line"/>
  <line x1="185" y1="600" x2="380" y2="830" class="conn-line"/>

  <!-- Lines from user to central use cases -->
  <line x1="195" y1="530" x2="760" y2="310" class="conn-line"/>
  <line x1="195" y1="540" x2="760" y2="410" class="conn-line"/>
  <line x1="195" y1="550" x2="760" y2="510" class="conn-line"/>
  <line x1="195" y1="560" x2="760" y2="710" class="conn-line"/>

  <!-- Lines from user to right use cases -->
  <line x1="195" y1="535" x2="1180" y2="310" class="conn-dash"/>
  <line x1="195" y1="545" x2="1180" y2="410" class="conn-dash"/>
  <line x1="195" y1="555" x2="1180" y2="510" class="conn-dash"/>
  <line x1="195" y1="565" x2="1180" y2="610" class="conn-dash"/>

  <!-- ADMIN ASSOCIATIONS -->
  <line x1="1725" y1="545" x2="1500" y2="740" class="conn-line"/>
  <line x1="1725" y1="565" x2="1500" y2="830" class="conn-line"/>

  <!-- STEREOTYPE EXTENDS & INCLUDES -->
  <path d="M 920 378 L 920 342" class="conn-dash"/>
  <text x="965" y="365" class="box-meta">&lt;&lt;includes&gt;&gt;</text>

  <path d="M 1340 442 L 1340 478" class="conn-dash"/>
  <text x="1390" y="465" class="box-meta">&lt;&lt;extends&gt;&gt;</text>

  <!-- Note Callout -->
  <rect x="740" y="870" width="560" height="85" class="note-badge"/>
  <text x="760" y="900" class="note-text">&#x2714; Verified Ground-Truth Implementation</text>
  <text x="760" y="925" class="box-meta">Supersedes first-review draft: Deletion, ExifTool metadata search,</text>
  <text x="760" y="945" class="box-meta">and decrypted downloads are fully operational and verified.</text>

  <!-- Footer -->
  <text x="960" y="1060" font-family="'Times New Roman', serif" font-size="15px" fill="#705D53" text-anchor="middle">
    All 18 use cases represent actual, working capabilities verified in the CipherVault repository and test evidence.
  </text>
</svg>