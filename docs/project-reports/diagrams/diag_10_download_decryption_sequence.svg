<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  
  <defs>
    <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #815621; }
    .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #705D53; }
    .box-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #2D241E; text-anchor: middle; }
    .box-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #705D53; text-anchor: middle; }
    .box-desc-left { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #705D53; }
    .step-num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
    .edge-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #815621; font-weight: 600; text-anchor: middle; }
    .line { stroke: #815621; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .dash-line { stroke: #705D53; stroke-width: 1.4; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }
    .card { fill: #FFFFFF; stroke: #E6D7CD; stroke-width: 1.2; rx: 6; }
    .card-peach { fill: #FEDDBD; stroke: #815621; stroke-width: 1.5; rx: 6; }
    .card-surface { fill: #FFF1E8; stroke: #E6D7CD; stroke-width: 1.2; rx: 6; }
    .card-green { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 1.5; rx: 6; }
    .card-blue { fill: #E3F2FD; stroke: #1565C0; stroke-width: 1.5; rx: 6; }
    .card-red { fill: #FFEBEE; stroke: #C62828; stroke-width: 1.5; rx: 6; }
</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#815621"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#705D53"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#FFF8F4"/>
  <text x="30" y="32" class="title">FIGURE 10.3 &mdash; FILE DOWNLOAD &amp; STREAMING DECRYPTION SEQUENCE</text>
  <text x="30" y="48" class="sub">Decryption pipeline: Authentication verification, Nonce parsing, AES-GCM streaming decryption, and GHASH tamper detection</text>

  <!-- Lifelines -->
  <rect x="40" y="70" width="120" height="35" class="card-peach"/>
  <text x="100" y="92" class="box-title">Android Client</text>
  <line x1="100" y1="105" x2="100" y2="440" stroke="#E6D7CD" stroke-width="1.5" stroke-dasharray="4,4"/>

  <rect x="230" y="70" width="120" height="35" class="card"/>
  <text x="290" y="92" class="box-title">FileController</text>
  <line x1="290" y1="105" x2="290" y2="440" stroke="#E6D7CD" stroke-width="1.5" stroke-dasharray="4,4"/>

  <rect x="420" y="70" width="130" height="35" class="card"/>
  <text x="485" y="92" class="box-title">FileStorageService</text>
  <line x1="485" y1="105" x2="485" y2="440" stroke="#E6D7CD" stroke-width="1.5" stroke-dasharray="4,4"/>

  <rect x="610" y="70" width="130" height="35" class="card"/>
  <text x="675" y="92" class="box-title">EncryptionService</text>
  <line x1="675" y1="105" x2="675" y2="440" stroke="#E6D7CD" stroke-width="1.5" stroke-dasharray="4,4"/>

  <rect x="760" y="70" width="100" height="35" class="card-blue"/>
  <text x="810" y="92" class="box-title">Disk Storage</text>
  <line x1="810" y1="105" x2="810" y2="440" stroke="#E6D7CD" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Messages -->
  <path d="M 100 130 L 290 130" class="line"/>
  <text x="195" y="122" class="edge-label">1. GET /api/files/{id}/download (Bearer)</text>

  <path d="M 290 160 L 485 160" class="line"/>
  <text x="387" y="152" class="edge-label">2. loadResource(fileId, userId)</text>

  <path d="M 485 190 L 810 190" class="line"/>
  <text x="647" y="182" class="edge-label">3. Open FileInputStream on encrypted blob</text>

  <path d="M 810 220 L 675 220" class="line"/>
  <text x="742" y="212" class="edge-label">4. Read first 12 bytes &rarr; Nonce/IV</text>

  <path d="M 675 250 L 675 275" stroke="#815621" stroke-width="1.5" fill="none"/>
  <path d="M 675 275 L 710 275" stroke="#815621" stroke-width="1.5" fill="none"/>
  <path d="M 710 275 L 710 260" stroke="#815621" stroke-width="1.5" fill="none"/>
  <path d="M 710 260 L 680 260" class="line"/>
  <text x="750" y="270" class="edge-label" style="text-anchor:start;">Init CipherInputStream(UDEK, IV)</text>

  <path d="M 675 300 L 485 300" class="dash-line"/>
  <text x="580" y="292" class="edge-label">5. Decrypted streaming pipe ready</text>

  <path d="M 485 330 L 290 330" class="dash-line"/>
  <text x="387" y="322" class="edge-label">6. Return ResponseEntity&lt;StreamingResponseBody&gt;</text>

  <path d="M 290 360 L 100 360" class="dash-line"/>
  <text x="195" y="352" class="edge-label">7. HTTP 200 (Stream chunks via OkHttp)</text>

  <rect x="50" y="380" width="280" height="50" class="card-green"/>
  <text x="190" y="400" class="box-title" style="fill:#2E7D32;">GHASH Integrity Verification</text>
  <text x="190" y="415" class="box-desc">If tag matches &rarr; Complete download to device</text>
  <text x="190" y="426" class="box-desc">If tampered &rarr; AEADBadTagException &rarr; Abort</text>
</svg>