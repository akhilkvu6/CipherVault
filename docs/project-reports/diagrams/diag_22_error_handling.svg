<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  
  <defs>
    <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #815621; }
    .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #705D53; }
    .box-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #2D241E; text-anchor: middle; }
    .box-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #705D53; text-anchor: middle; }
    .box-desc-left { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #705D53; }
    .step-num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
    .edge-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #815621; font-weight: 600; text-anchor: middle; }
    .line { stroke: #815621; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .dash-line { stroke: #705D53; stroke-width: 1.4; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }
    .card { fill: #FFFFFF; stroke: #E6D7CD; stroke-width: 1.2; rx: 6; }
    .card-peach { fill: #FEDDBD; stroke: #815621; stroke-width: 1.5; rx: 6; }
    .card-surface { fill: #FFF1E8; stroke: #E6D7CD; stroke-width: 1.2; rx: 6; }
    .card-green { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 1.5; rx: 6; }
    .card-blue { fill: #E3F2FD; stroke: #1565C0; stroke-width: 1.5; rx: 6; }
    .card-red { fill: #FFEBEE; stroke: #C62828; stroke-width: 1.5; rx: 6; }
</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#815621"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#705D53"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#FFF8F4"/>
  <text x="30" y="32" class="title">FIGURE 10.9 &mdash; FAULT-TOLERANCE &amp; ERROR-HANDLING RECOVERY FLOW</text>
  <text x="30" y="48" class="sub">Structured recovery paths: Network timeout, Authentication expiry, Quota exhaustion, Tamper detection, and Duplicate conflict</text>

  <!-- Fault 1 -->
  <rect x="50" y="80" width="240" height="110" class="card-red"/>
  <text x="170" y="105" class="box-title" style="fill:#C62828;">FAULT: NETWORK TIMEOUT</text>
  <text x="60" y="125" class="box-desc-left">&bull; SocketTimeoutException (&gt;60s)</text>
  <text x="60" y="140" class="box-desc-left">&bull; Host offline / Wi-Fi disconnected</text>
  <line x1="50" y1="147" x2="290" y2="147" stroke="#E6D7CD"/>
  <text x="60" y="162" class="box-desc-left" style="fill:#2E7D32; font-weight:bold;">RECOVERY:</text>
  <text x="60" y="177" class="box-desc-left">&bull; Retry with exponential backoff</text>
  <text x="60" y="187" class="box-desc-left">&bull; Show Connection Dialog with IP edit</text>

  <!-- Fault 2 -->
  <rect x="330" y="80" width="240" height="110" class="card-red"/>
  <text x="450" y="105" class="box-title" style="fill:#C62828;">FAULT: 401 UNAUTHORIZED</text>
  <text x="340" y="125" class="box-desc-left">&bull; JWT Token expired (&gt;24 hours)</text>
  <text x="340" y="140" class="box-desc-left">&bull; Token version mismatch (revoked)</text>
  <line x1="330" y1="147" x2="570" y2="147" stroke="#E6D7CD"/>
  <text x="340" y="162" class="box-desc-left" style="fill:#2E7D32; font-weight:bold;">RECOVERY:</text>
  <text x="340" y="177" class="box-desc-left">&bull; Clear EncryptedSharedPreferences</text>
  <text x="340" y="187" class="box-desc-left">&bull; Route to LoginActivity with toast</text>

  <!-- Fault 3 -->
  <rect x="610" y="80" width="240" height="110" class="card-red"/>
  <text x="730" y="105" class="box-title" style="fill:#C62828;">FAULT: STORAGE QUOTA EXCEEDED</text>
  <text x="620" y="125" class="box-desc-left">&bull; Upload exceeds 10 GB user quota</text>
  <text x="620" y="140" class="box-desc-left">&bull; HTTP 413 Payload Too Large</text>
  <line x1="610" y1="147" x2="850" y2="147" stroke="#E6D7CD"/>
  <text x="620" y="162" class="box-desc-left" style="fill:#2E7D32; font-weight:bold;">RECOVERY:</text>
  <text x="620" y="177" class="box-desc-left">&bull; Abort stream before disk write</text>
  <text x="620" y="187" class="box-desc-left">&bull; Display Storage Full BottomSheet</text>

  <!-- Fault 4 -->
  <rect x="50" y="230" width="240" height="110" class="card-red"/>
  <text x="170" y="255" class="box-title" style="fill:#C62828;">FAULT: GHASH TAMPER FAILURE</text>
  <text x="60" y="275" class="box-desc-left">&bull; AEADBadTagException on download</text>
  <text x="60" y="290" class="box-desc-left">&bull; Ciphertext altered or truncated</text>
  <line x1="50" y1="297" x2="290" y2="297" stroke="#E6D7CD"/>
  <text x="60" y="312" class="box-desc-left" style="fill:#2E7D32; font-weight:bold;">RECOVERY:</text>
  <text x="60" y="327" class="box-desc-left">&bull; Instantly abort decryption pipeline</text>
  <text x="60" y="337" class="box-desc-left">&bull; Show 'File Tampering Alert' dialog</text>

  <!-- Fault 5 -->
  <rect x="330" y="230" width="240" height="110" class="card-red"/>
  <text x="450" y="255" class="box-title" style="fill:#C62828;">FAULT: 409 CONFLICT (DUPLICATE)</text>
  <text x="340" y="275" class="box-desc-left">&bull; SHA-256 hash exists in vault</text>
  <text x="340" y="290" class="box-desc-left">&bull; uq_user_sha256 constraint hits</text>
  <line x1="330" y1="297" x2="570" y2="297" stroke="#E6D7CD"/>
  <text x="340" y="312" class="box-desc-left" style="fill:#2E7D32; font-weight:bold;">RECOVERY:</text>
  <text x="340" y="327" class="box-desc-left">&bull; Skip payload disk write</text>
  <text x="340" y="337" class="box-desc-left">&bull; Highlight existing file in Vault</text>

  <!-- Fault 6 -->
  <rect x="610" y="230" width="240" height="110" class="card-red"/>
  <text x="730" y="255" class="box-title" style="fill:#C62828;">FAULT: 429 TOO MANY REQUESTS</text>
  <text x="620" y="275" class="box-desc-left">&bull; &gt;5 consecutive failed logins</text>
  <text x="620" y="290" class="box-desc-left">&bull; Brute-force rate limiter tripped</text>
  <line x1="610" y1="297" x2="850" y2="297" stroke="#E6D7CD"/>
  <text x="620" y="312" class="box-desc-left" style="fill:#2E7D32; font-weight:bold;">RECOVERY:</text>
  <text x="620" y="327" class="box-desc-left">&bull; 15-minute temporary IP lockout</text>
  <text x="620" y="337" class="box-desc-left">&bull; Display cooldown countdown timer</text>

  <!-- Summary Banner -->
  <rect x="50" y="380" width="800" height="60" class="card-green"/>
  <text x="450" y="405" class="box-title" style="fill:#2E7D32; font-size:13px;">ZERO-DATA-CORRUPTION &amp; SAFE-FAIL PRINCIPLE</text>
  <text x="450" y="422" class="box-desc">All exceptions trigger clean state rollback, clear sensitive buffers, and display actionable user-friendly recovery alerts</text>
</svg>