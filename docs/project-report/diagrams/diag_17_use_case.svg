<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  
  <defs>
    <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #815621; }
    .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #705D53; }
    .box-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #2D241E; text-anchor: middle; }
    .box-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #705D53; text-anchor: middle; }
    .box-desc-left { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #705D53; }
    .step-num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
    .edge-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #815621; font-weight: 600; text-anchor: middle; }
    .line { stroke: #815621; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .dash-line { stroke: #705D53; stroke-width: 1.4; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }
    .card { fill: #FFFFFF; stroke: #E6D7CD; stroke-width: 1.2; rx: 6; }
    .card-peach { fill: #FEDDBD; stroke: #815621; stroke-width: 1.5; rx: 6; }
    .card-surface { fill: #FFF1E8; stroke: #E6D7CD; stroke-width: 1.2; rx: 6; }
    .card-green { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 1.5; rx: 6; }
    .card-blue { fill: #E3F2FD; stroke: #1565C0; stroke-width: 1.5; rx: 6; }
    .card-red { fill: #FFEBEE; stroke: #C62828; stroke-width: 1.5; rx: 6; }
</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#815621"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#705D53"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#FFF8F4"/>
  <text x="30" y="32" class="title">FIGURE 4.1 &mdash; USE CASE MODELING DIAGRAM</text>
  <text x="30" y="48" class="sub">Core interactions for Mobile Vault User and System Host Administrator</text>

  <!-- Actor 1: Mobile User -->
  <circle cx="80" cy="200" r="16" fill="#815621"/>
  <line x1="80" y1="216" x2="80" y2="260" stroke="#815621" stroke-width="2"/>
  <line x1="60" y1="230" x2="100" y2="230" stroke="#815621" stroke-width="2"/>
  <line x1="80" y1="260" x2="65" y2="295" stroke="#815621" stroke-width="2"/>
  <line x1="80" y1="260" x2="95" y2="295" stroke="#815621" stroke-width="2"/>
  <text x="80" y="320" class="box-title">Mobile User</text>

  <!-- System Boundary -->
  <rect x="180" y="70" width="540" height="380" fill="#FFFFFF" stroke="#815621" stroke-width="2" rx="10"/>
  <text x="450" y="95" class="box-title" style="fill:#815621; font-size:13px;">CIPHERVAULT APPLICATION SYSTEM</text>

  <!-- Use cases (Ovals) -->
  <ellipse cx="320" cy="130" rx="95" ry="22" class="card-peach"/>
  <text x="320" y="135" class="box-desc" style="font-weight:600;">UC-01: Authenticate (PIN/Bio)</text>

  <ellipse cx="320" cy="185" rx="95" ry="22" class="card"/>
  <text x="320" y="190" class="box-desc" style="font-weight:600;">UC-02: Stage &amp; Preview File</text>

  <ellipse cx="320" cy="240" rx="95" ry="22" class="card"/>
  <text x="320" y="245" class="box-desc" style="font-weight:600;">UC-03: Upload &amp; Encrypt File</text>

  <ellipse cx="320" cy="295" rx="95" ry="22" class="card"/>
  <text x="320" y="300" class="box-desc" style="font-weight:600;">UC-04: Browse &amp; Sort Vault</text>

  <ellipse cx="320" cy="350" rx="95" ry="22" class="card"/>
  <text x="320" y="355" class="box-desc" style="font-weight:600;">UC-05: Inspect Forensic Details</text>

  <ellipse cx="320" cy="405" rx="95" ry="22" class="card"/>
  <text x="320" y="410" class="box-desc" style="font-weight:600;">UC-06: Decrypt &amp; Download</text>

  <ellipse cx="580" cy="150" rx="95" ry="22" class="card"/>
  <text x="580" y="155" class="box-desc" style="font-weight:600;">UC-07: Search by Metadata</text>

  <ellipse cx="580" cy="210" rx="95" ry="22" class="card"/>
  <text x="580" y="215" class="box-desc" style="font-weight:600;">UC-08: Batch Multi-Select Delete</text>

  <ellipse cx="580" cy="270" rx="95" ry="22" class="card"/>
  <text x="580" y="275" class="box-desc" style="font-weight:600;">UC-09: Toggle Dynamic Theme</text>

  <ellipse cx="580" cy="350" rx="95" ry="22" class="card-blue"/>
  <text x="580" y="355" class="box-desc" style="font-weight:600;">UC-10: Server Lifecycle Control</text>

  <ellipse cx="580" cy="405" rx="95" ry="22" class="card-blue"/>
  <text x="580" y="410" class="box-desc" style="font-weight:600;">UC-11: Monitor Ports &amp; Logs</text>

  <!-- Actor 2: Host Admin -->
  <circle cx="820" cy="350" r="16" fill="#815621"/>
  <line x1="820" y1="366" x2="820" y2="410" stroke="#815621" stroke-width="2"/>
  <line x1="800" y1="380" x2="840" y2="380" stroke="#815621" stroke-width="2"/>
  <line x1="820" y1="410" x2="805" y2="445" stroke="#815621" stroke-width="2"/>
  <line x1="820" y1="410" x2="835" y2="445" stroke="#815621" stroke-width="2"/>
  <text x="820" y="465" class="box-title">Host Admin</text>

  <!-- Links -->
  <line x1="100" y1="220" x2="225" y2="135" stroke="#815621" stroke-width="1.3"/>
  <line x1="100" y1="230" x2="225" y2="185" stroke="#815621" stroke-width="1.3"/>
  <line x1="100" y1="240" x2="225" y2="240" stroke="#815621" stroke-width="1.3"/>
  <line x1="100" y1="250" x2="225" y2="295" stroke="#815621" stroke-width="1.3"/>
  <line x1="100" y1="260" x2="225" y2="350" stroke="#815621" stroke-width="1.3"/>
  <line x1="100" y1="270" x2="225" y2="405" stroke="#815621" stroke-width="1.3"/>
  <line x1="100" y1="235" x2="485" y2="150" stroke="#815621" stroke-width="1.3"/>
  <line x1="100" y1="245" x2="485" y2="210" stroke="#815621" stroke-width="1.3"/>
  <line x1="100" y1="255" x2="485" y2="270" stroke="#815621" stroke-width="1.3"/>

  <line x1="800" y1="375" x2="675" y2="355" stroke="#815621" stroke-width="1.3"/>
  <line x1="800" y1="385" x2="675" y2="405" stroke="#815621" stroke-width="1.3"/>
</svg>