spring.application.name=ciphervault

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ciphervault
spring.datasource.username=${CIPHERVAULT_DB_USERNAME:ciphervault_user}
spring.datasource.password=${CIPHERVAULT_DB_PASSWORD:CipherVault@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Spring's default banner; CipherVault prints its own startup banner.
spring.main.banner-mode=off

# Hibernate and framework log suppression for clean console output
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.orm.core=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN

# Server
server.port=8080

# File upload limits
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
spring.mvc.async.request-timeout=600000

# Environment
ciphervault.environment=${CIPHERVAULT_ENV:development}
ciphervault.security.dev-defaults-enabled=${CIPHERVAULT_DEV_DEFAULTS:true}

# Security and cryptographic key management
# Production deployments must provide these through environment variables.
ciphervault.jwt.secret=${CIPHERVAULT_JWT_SECRET:}
ciphervault.jwt.expiration-ms=${CIPHERVAULT_JWT_EXPIRATION_MS:86400000}
ciphervault.security.master-key=${CIPHERVAULT_MASTER_KEY:}
ciphervault.security.pbkdf2.salt=${CIPHERVAULT_PBKDF2_SALT:}
ciphervault.security.pbkdf2.iterations=${CIPHERVAULT_PBKDF2_ITERATIONS:65536}